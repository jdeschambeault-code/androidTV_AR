<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>TV Hub</title>
<script src="$WEBAPIS/webapis/webapis.js"></script>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: #000; color: #eee;
               font-family: "SamsungOne", "Tizen Sans", sans-serif; overflow: hidden; }
  #clock { position: absolute; top: 60px; right: 90px; font-size: 44px; color: #777; }
  .row { position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%);
         display: flex; justify-content: center; gap: 60px; }
  .tile { width: 340px; height: 300px; border-radius: 28px; background: #111;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 26px; font-size: 40px; color: #aaa; border: 4px solid transparent;
          transition: transform .12s, background .12s, color .12s; }
  .tile svg { width: 110px; height: 110px; stroke: currentColor; fill: none; stroke-width: 1.6;
              stroke-linecap: round; stroke-linejoin: round; }
  .tile.small { width: 240px; height: 210px; font-size: 32px; gap: 16px; }
  .tile.small svg { width: 70px; height: 70px; }
  .row.grid { top: 340px; transform: none; left: 210px; right: auto; width: 1500px; height: 680px;
              flex-wrap: wrap; justify-content: flex-start; align-content: flex-start; gap: 40px;
              overflow: hidden; padding: 20px; box-sizing: border-box; }
  .tile img { width: 120px; height: 90px; object-fit: contain; }
  .tile .letter { width: 90px; height: 90px; border-radius: 20px; background: #222; color: #ddd;
                  font-size: 54px; display: flex; align-items: center; justify-content: center; }
  .tile.small div:last-child { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile.on { background: #1d1d1d; color: #fff; border-color: #fff; transform: scale(1.08); }
  .tile.off { opacity: .35; }
  .tile .sub { font-size: 22px; color: #666; margin-top: -10px; max-width: 300px; text-align: center;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile.on .sub { color: #aaa; }
  #rename { position: absolute; inset: 0; background: #000d; display: none; flex-direction: column;
            align-items: center; justify-content: center; gap: 30px; font-size: 32px; color: #aaa; }
  #rname { width: 800px; font-size: 48px; padding: 16px 24px; background: #111; color: #fff;
           border: 3px solid #fff; border-radius: 16px; outline: none; }
  #title .tab { display: inline-block; margin: 0 18px; padding: 8px 30px; border-radius: 40px; color: #555; border: 3px solid transparent; }
  #title .tab.sel { color: #fff; background: #1a1a1a; }
  #title .tab.on { border-color: #fff; }
  #title .hint { display: block; font-size: 22px; color: #444; margin-top: 10px; }
  #pick { position: absolute; inset: 0; background: #000d; display: none; flex-direction: column;
          align-items: center; justify-content: center; gap: 24px; }
  #ptitle { font-size: 36px; color: #888; }
  #plist .opt { width: 560px; padding: 18px 30px; margin: 8px 0; font-size: 36px; border-radius: 16px; color: #aaa;
                background: #111; border: 3px solid transparent; }
  #plist .opt.on { color: #fff; border-color: #fff; background: #1d1d1d; }
  #title { position: absolute; top: 200px; width: 100%; text-align: center; font-size: 40px; color: #555; }
  #status { position: absolute; bottom: 60px; width: 100%; text-align: center; font-size: 28px; color: #555; }
  #diag { position: absolute; inset: 60px; background: #000e; font: 22px monospace; color: #8c8;
          white-space: pre-wrap; overflow: hidden; display: none; padding: 20px; border: 1px solid #333; }
</style>
</head>
<body>
<div id="clock"></div>
<div id="title"></div>
<div class="row" id="row"></div>
<div id="status"></div>
<div id="diag"></div>
<div id="pick"><div id="ptitle"></div><div id="plist"></div></div>
<div id="rename"><div id="rlabel"></div><input id="rname" maxlength="24" autocomplete="off"></div>
<script src="main.js"></script>
</body>
</html>
